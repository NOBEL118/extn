<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>ReplyAI</title>

  <link
    rel="stylesheet"
    href="src/popup.css"
  />

</head>

<body>

  <div class="container">

    <div class="top">

      <div class="logo">
        ⚡
      </div>

      <div>

        <h1>
          ReplyAI
        </h1>

      </div>

    </div>

    <div class="card">

      <label>
        Groq API Key
      </label>

      <input
        type="password"
        id="apiKey"
        placeholder="sk_..."
      />

      <label>
        Model
      </label>

          <select id="model">
        
            <option value="openai/gpt-oss-120b">
              OpenAI GPT-OSS 120B
            </option>

            <option value="openai/gpt-oss-20b">
              OpenAI GPT-OSS 20B
            </option>

          </select>
      <label>
          Reply Length
      </label>
      <select id="maxLength">

        <option value="short">
          Short
        </option>

        <option
          value="medium"
          selected
        >
          Medium
        </option>

        <option value="long">
          Long
        </option>

      </select>

      <button id="saveBtn">
        Save Settings
      </button>

      <div id="status"></div>

    </div>

   <div class="footer">
    <p>Your API key stays locally in Chrome storage.</p>
    <div class="footer-links">
      <a id="rai-help-link" href="#" target="_blank" rel="noopener noreferrer">Need help? Ask ChatGPT</a>
      <span class="dot">•</span>
      <a href="https://x.com/nobelxenon" target="_blank" rel="noopener noreferrer">Built by @nobelxenon</a>
    </div>
  </div>
  </div>

  <script src="src/popup.js"></script>

</body>

</html>
