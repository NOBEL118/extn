<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>ReplyAI</title>

  <link
    rel="stylesheet"
    href="src/popup.css"
  />

</head>

<body>

  <div class="container">

    <div class="top">

      <div class="logo">
        ⚡
      </div>

      <div>

        <h1>
          ReplyAI
        </h1>

      </div>

    </div>

    <div class="card">

      <label>
        Sarvam API Key
      </label>

      <input
        type="password"
        id="apiKey"
        placeholder="sk_..."
      />

      <label>
        Model
      </label>

          <select id="model">
            
            <option value="sarvam-l">
              Sarvam 105B
            </option>

          </select>
      <label>
          Reply Length
      </label>
      <select id="maxLength">

        <option value="short">
          Short
        </option>

        <option
          value="medium"
          selected
        >
          Medium
        </option>

        <option value="long">
          Long
        </option>

      </select>

      <button id="saveBtn">
        Save Settings
      </button>

      <div id="status"></div>

    </div>

    <div class="footer">

      Your API key stays locally
      in Chrome storage.

    </div>

  </div>

  <script src="src/popup.js"></script>

</body>

</html>
